name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, check, and build
        run: npm ci && npm run check && npm run build
        env:
          SITE_URL: https://yikunpeng82-sys.github.io
          BASE_PATH: /kunpeng-yi-website/
